# Nexio OS — Continuous Integration
#
# 5 gates, all mandatory before merge:
#   1. quality  — lint + typecheck + format check
#   2. security — audit + SAST
#   3. test     — unit + integration (Vitest + Miniflare)
#   4. build    — production build + Wrangler dry-run
#   5. e2e      — Playwright against the preview deploy
#
# The 5 gates run in parallel where dependencies allow. The branch
# protection rule on `main` requires all 5 to be green.
#
# Anti-slop note for agents: this file is owned by the orchestrator.
# Specialists do not edit it without an ADR.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # GATE 1 — Quality: lint, typecheck, format
  # ─────────────────────────────────────────────────────────────────────
  quality:
    name: 1 · Quality (lint + types + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Oxlint + ESLint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check (Prettier)
        run: pnpm format:check

  # ─────────────────────────────────────────────────────────────────────
  # GATE 2 — Security: audit + CodeQL SAST
  # ─────────────────────────────────────────────────────────────────────
  security:
    name: 2 · Security (audit + SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required for CodeQL upload
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (pnpm audit --prod)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # ─────────────────────────────────────────────────────────────────────
  # GATE 3 — Tests: unit + integration with Miniflare
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: 3 · Tests (unit + integration)
    runs-on: ubuntu-latest
    needs: quality  # don't waste cycles if lint already failed
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit + integration tests
        run: pnpm test --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # GATE 4 — Build: production build + Wrangler dry-run
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: 4 · Build (Vite + Wrangler dry-run)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Wrangler dry-run (validate config)
        run: pnpm exec wrangler deploy --dry-run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            .output/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────
  # GATE 5 — E2E: Playwright against the preview deploy
  # ─────────────────────────────────────────────────────────────────────
  e2e:
    name: 5 · E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build for E2E
        run: pnpm build

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
