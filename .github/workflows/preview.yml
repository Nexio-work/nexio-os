# Nexio OS — Preview Deploy
#
# Every PR gets a temporary URL on Cloudflare Pages so the reviewer can
# click-test the actual UI, not just read the diff. This is mandatory
# per AGENTS.md: "every interactive control must actually work, verified
# by a real click." A preview URL makes that verification real.
#
# The preview is torn down when the PR is closed or merged.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write  # required to post the preview URL comment

concurrency: preview-${{ github.event.pull_request.number }}

jobs:
  preview:
    name: Deploy preview to Cloudflare Pages
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages (preview branch)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nexio-os --branch=pr-${{ github.event.pull_request.number }}

      - name: Post preview URL as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://pr-${context.payload.pull_request.number}.nexio-os.pages.dev`;
            const body = `🔍 **Preview deploy ready:** ${url}\n\nThis URL is live until the PR is closed. Click-test the UI before approving.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body.startsWith('🔍 **Preview deploy ready:**'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  teardown:
    name: Tear down preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Preview for PR ${{ github.event.pull_request.number }} will be GC'd by Cloudflare Pages."
